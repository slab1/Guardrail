apiVersion: v1
kind: Namespace
metadata:
  name: guardrail
  labels:
    app.kubernetes.io/name: guardrail
    app.kubernetes.io/part-of: guardrail-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardrail
  namespace: guardrail
  labels:
    app.kubernetes.io/name: guardrail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guardrail
  namespace: guardrail
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guardrail
  namespace: guardrail
subjects:
  - kind: ServiceAccount
    name: guardrail
    namespace: guardrail
roleRef:
  kind: Role
  name: guardrail
  apiGroup: rbac.authorization.k8s.io
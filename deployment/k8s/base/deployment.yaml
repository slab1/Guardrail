apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-api
  namespace: guardrail
  labels:
    app.kubernetes.io/name: guardrail-api
    app.kubernetes.io/part-of: guardrail-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: guardrail-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guardrail-api
        app.kubernetes.io/part-of: guardrail-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: guardrail
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: guardrail-api
          image: guardrail/guardrail:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: GUARDRAIL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrail-secrets
                  key: secret-key
            - name: GUARDRAIL_AUDIT_LOG_PATH
              value: "/var/log/guardrail/audit.log"
            - name: GUARDRAIL_LSFS_ROOT
              value: "/var/lib/guardrail/lsfs"
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: guardrail-secrets
                  key: nvidia-api-key
                  optional: true
            - name: NVIDIA_BASE_URL
              value: "https://integrate.api.nvidia.com/v1"
            - name: NVIDIA_MODEL
              value: "nvidia/nemotron-3-ultra-550b-a55b"
            - name: PROMETHEUS_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: CLUSTER_MIN_INSTANCES
              value: "2"
            - name: CLUSTER_MAX_INSTANCES
              value: "10"
            - name: LOAD_BALANCER_ALGORITHM
              value: "least_latency"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: audit-logs
              mountPath: /var/log/guardrail
            - name: lsfs-data
              mountPath: /var/lib/guardrail/lsfs
            - name: firecracker-data
              mountPath: /tmp/guardrail_firecracker
      volumes:
        - name: audit-logs
          persistentVolumeClaim:
            claimName: guardrail-audit-logs
        - name: lsfs-data
          persistentVolumeClaim:
            claimName: guardrail-lsfs
        - name: firecracker-data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: guardrail-api
  namespace: guardrail
  labels:
    app.kubernetes.io/name: guardrail-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: guardrail-api
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guardrail-audit-logs
  namespace: guardrail
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guardrail-lsfs
  namespace: guardrail
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: guardrail

resources:
  - ../../base

commonLabels:
  environment: production

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: guardrail-config
    behavior: merge
    literals:
      - LOAD_BALANCER_ALGORITHM=least_latency
      - CLUSTER_MIN_INSTANCES=3
      - CLUSTER_MAX_INSTANCES=20
      - PROMETHEUS_ENABLED=true

secretGenerator:
  - name: guardrail-secrets
    behavior: merge
    literals:
      - secret-key=REPLACE_WITH_ACTUAL_SECRET
      - nvidia-api-key=REPLACE_WITH_NVIDIA_API_KEY
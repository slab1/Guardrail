# Docker Compose for Guardrail Development and Production

version: '3.8'

services:
  # Guardrail API Server
  guardrail:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: guardrail-api
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - GUARDRAIL_SECRET_KEY=${GUARDRAIL_SECRET_KEY:-dev-secret-change-in-production}
      - GUARDRAIL_AUDIT_LOG_PATH=/var/log/guardrail/audit.log
      - GUARDRAIL_LSFS_ROOT=/var/lib/guardrail/lsfs
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=https://integrate.api.nvidia.com/v1
      - NVIDIA_MODEL=nvidia/nemotron-3-ultra-550b-a55b
      - PROMETHEUS_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - CLUSTER_MIN_INSTANCES=1
      - CLUSTER_MAX_INSTANCES=5
      - LOAD_BALANCER_ALGORITHM=least_latency
    volumes:
      - guardrail-logs:/var/log/guardrail
      - guardrail-lsfs:/var/lib/guardrail/lsfs
      - guardrail-firecracker:/tmp/guardrail_firecracker
    depends_on:
      - otel-collector
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: guardrail-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.1.0
    container_name: guardrail-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped

  # OpenTelemetry Collector for distributed tracing
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: guardrail-otel
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command:
      - '--config=/etc/otel-collector-config.yaml'
    depends_on:
      - prometheus
    restart: unless-stopped

  # Redis for session/token caching (optional)
  redis:
    image: redis:7-alpine
    container_name: guardrail-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # PostgreSQL for persistent storage (optional)
  postgres:
    image: postgres:15-alpine
    container_name: guardrail-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=guardrail
      - POSTGRES_USER=guardrail
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-guardrail}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  guardrail-logs:
  guardrail-lsfs:
  guardrail-firecracker:
  prometheus-data:
  grafana-data:
  redis-data:
  postgres-data:

networks:
  default:
    name: guardrail-network
# Default values for Guardrail Helm chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Guardrail API configuration
guardrail:
  # Image configuration
  image:
    repository: guardrail/guardrail
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecrets: []

  # Replica count
  replicaCount: 3

  # Resource limits
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  # Environment variables
  env:
    GUARDRAIL_AUDIT_LOG_PATH: "/var/log/guardrail/audit.log"
    GUARDRAIL_LSFS_ROOT: "/var/lib/guardrail/lsfs"
    NVIDIA_BASE_URL: "https://integrate.api.nvidia.com/v1"
    NVIDIA_MODEL: "nvidia/nemotron-3-ultra-550b-a55b"
    PROMETHEUS_ENABLED: "true"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    CLUSTER_MIN_INSTANCES: "2"
    CLUSTER_MAX_INSTANCES: "10"
    LOAD_BALANCER_ALGORITHM: "least_latency"

  # Secrets (managed separately)
  secrets:
    secretKey: ""
    nvidiaApiKey: ""

  # Service configuration
  service:
    type: ClusterIP
    ports:
      http: 8080
      metrics: 9090

  # Ingress configuration
  ingress:
    enabled: false
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    hosts:
      - host: guardrail.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: guardrail-tls
        hosts:
          - guardrail.example.com

  # Health checks
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 10

  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5

# Monitoring configuration
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 15s
      path: /metrics
      port: metrics

  grafana:
    enabled: true
    dashboards:
      enabled: true

  otel:
    enabled: true
    collector:
      enabled: true
      endpoint: "http://otel-collector:4317"

# Persistence configuration
persistence:
  auditLogs:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce

  lsfs:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# RBAC
rbac:
  create: true

# ServiceAccount
serviceAccount:
  create: true
  name: guardrail

# Network Policies
networkPolicy:
  enabled: true
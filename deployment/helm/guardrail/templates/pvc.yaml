apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guardrail-audit-logs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: guardrail
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.auditLogs.size }}
  {{- if .Values.persistence.auditLogs.storageClass }}
  storageClassName: {{ .Values.persistence.auditLogs.storageClass }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: guardrail-lsfs
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: guardrail
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.lsfs.size }}
  {{- if .Values.persistence.lsfs.storageClass }}
  storageClassName: {{ .Values.persistence.lsfs.storageClass }}
  {{- end }}

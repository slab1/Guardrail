apiVersion: v1
kind: Service
metadata:
  name: guardrail
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: guardrail
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.guardrail.service.type }}
  ports:
    - port: {{ .Values.guardrail.service.ports.http }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.guardrail.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: guardrail
    app.kubernetes.io/instance: {{ .Release.Name }}
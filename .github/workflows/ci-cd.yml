name: Guardrail OS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------
  # Job 1: Frontend Type-Check & Production Build
  # ---------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Latest (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Validate TypeScript Compilation & Vite Build
        run: npm run build

  # ---------------------------------------------------------------
  # Job 2: Backend Python Kernel Pytest Suite & Coverage
  # ---------------------------------------------------------------
  backend-test:
    name: Kernel Safety Tests & SMT Verifier
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ --cov=src/guardrail --cov-report=term-missing

  # ---------------------------------------------------------------
  # Job 3: Security & SAST Audit (Static Code Analysis)
  # ---------------------------------------------------------------
  security-audit:
    name: Security SAST & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Latest (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node Security Audit
        run: npm audit --audit-level=high

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Security Tools
        run: pip install bandit

      - name: Run Bandit SAST Scan on Guardrail Kernel
        run: bandit -r src/ -ll -ii

  # ---------------------------------------------------------------
  # Job 4: Firestore Rules Verification
  # ---------------------------------------------------------------
  firestore-rules-check:
    name: Firestore Security Rules Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Rules File Presence
        run: |
          if [ ! -f "firestore.rules" ]; then
            echo "::error::firestore.rules file missing!"
            exit 1
          fi
          echo "firestore.rules verified successfully."

  # ---------------------------------------------------------------
  # Job 5: Docker Containerization Build Test
  # ---------------------------------------------------------------
  docker-build:
    name: Docker Production Image Build
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test, security-audit]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: guardrail-os:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

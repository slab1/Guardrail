name: Guardrail OS Continuous Integration & Safety Tests

on:
  push:
    branches: [ main, master, 'feature/*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Job 1: Frontend Type Validation & Asset Compilation
  # ---------------------------------------------------------------
  frontend-test:
    name: Frontend TypeScript & Vite Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Latest (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Compiler & Vite Build
        run: npm run build

  # ---------------------------------------------------------------
  # Job 2: Python Kernel & SMT Verifier Test Suite
  # ---------------------------------------------------------------
  kernel-pytest:
    name: Kernel SMT Verifier & Data Plane PEP Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Pytest Property Verification Suite
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -v --cov=src/guardrail --cov-report=term-missing

      - name: Verify Live Fast-Path PEP Latency (< 1ms Target)
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_data_plane_pep.py -k "test_data_plane_pep_happy_path" -v

  # ---------------------------------------------------------------
  # Job 3: Strict SAST & Vulnerability Security Audit
  # ---------------------------------------------------------------
  security-audit:
    name: Strict SAST Code & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Latest (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Node Security Audit (Critical Severity Gate)
        run: npm audit --audit-level=critical

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Bandit SAST Scanner
        run: python -m pip install bandit

      - name: Run Bandit SAST Scan (Strict)
        run: python -m bandit -r src/ -ll -ii

  # ---------------------------------------------------------------
  # Job 4: Integration Probes & Security Rules Integrity
  # ---------------------------------------------------------------
  integration-probes:
    name: Integration Probes & Security Rules Integrity
    runs-on: ubuntu-latest
    needs: [frontend-test, kernel-pytest, security-audit]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kernel Requirements
        run: pip install -r requirements.txt uvicorn

      - name: Start FastAPI Background Kernel & Probe Endpoints
        run: |
          PYTHONPATH=src uvicorn app:app --host 127.0.0.1 --port 8888 &
          PID=$!
          sleep 3
          python3 -c "
          import urllib.request, json
          res = urllib.request.urlopen('http://127.0.0.1:8888/api/kernel/state')
          data = json.loads(res.read().decode())
          assert data.get('trust_score') == 100.0
          print('Integration Probe Success: Kernel state online.')
          "
          kill $PID

      - name: Validate Firestore Rules Presence
        run: |
          test -f "firestore.rules"
          test -f "firebase-blueprint.json"
          echo "Firestore security rules verified."
